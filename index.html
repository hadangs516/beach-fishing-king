<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#156975"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><title>해변 낚시왕</title><link rel="preload" href="assets/cove-wide.webp" as="image" media="(min-aspect-ratio: 92/100)"><link rel="preload" href="assets/cove-tall.webp" as="image" media="(max-aspect-ratio: 92/100)"><link rel="stylesheet" href="game.css?v=3"></head>
<body><main id="scene" aria-label="소라빛 해변 낚시터">
<canvas id="coast" aria-hidden="true"></canvas><canvas id="world" aria-label="해변의 낚시꾼 · 바닥을 눌러 이동"></canvas>
<div class="profile-area">
  <button id="account" data-open="account" class="profile"><i class="float-mark"><img id="avatar" alt=""></i><span class="profile-name"><strong>해변 낚시왕</strong><small id="playerName">게스트</small></span></button>
  <div class="place"><i data-icon="sun"></i><span>소라빛 해변</span></div>
</div>
<div class="top-tools">
  <div class="wallet"><i data-icon="coin"></i><strong id="money">0</strong></div>
  <button aria-label="설정" class="round gear" data-open="settings"><i data-icon="settings"></i></button>
  <button class="pack" data-open="bag" aria-label="인벤토리"><i data-icon="pack"></i><span>인벤토리</span><small id="capacity">0 / 6</small></button>
</div>
<div id="notice" role="status" hidden></div>
<div class="stick" id="stick" aria-label="이동 조이스틱"><b>⌃</b><b>‹</b><b>›</b><b>⌄</b><span></span></div>
<div class="pc-help"><kbd>WASD</kbd> 이동 <span>·</span> <kbd>Space</kbd> 낚시</div>
<div class="action-pad"><button class="interact" data-open="interact"><i data-icon="talk"></i><span>상호작용</span></button><button id="cast" aria-describedby="hint"><i data-icon="castRod"></i><b>낚싯줄 던지기</b></button></div>
<div id="meter" hidden><div class="meter-head"><b id="powerText">0%</b><span id="meterDistance">2.0 m</span></div><div class="track"><span></span></div></div>
<span id="hint" class="sr-only">꾹 눌렀다가 원하는 힘에서 놓으세요</span>
<div class="snack" id="snack" role="status"><i data-icon="device"></i><span id="deviceText"></span><button data-open="device">바꾸기</button><button id="dismiss" aria-label="알림 닫기">×</button></div>
</main>
<dialog id="panel"><div class="dialog-head"><h2 id="panelTitle"></h2><button class="close" id="closePanel" aria-label="닫기">×</button></div><div id="panelBody"></div></dialog>
<script src="three.min.js"></script><script src="catalog.js?v=3"></script><script src="fish-art.js?v=3"></script><script src="music.js?v=3"></script><script src="beach-map.js?v=3"></script><script src="angler.js?v=3"></script><script src="world.js?v=3"></script><script src="game.js?v=3"></script></body></html>
